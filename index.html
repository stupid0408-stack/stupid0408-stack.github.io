<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함승호 | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: #1e293b;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .profile-header {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        .profile-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .education {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .tagline {
            font-size: 1.05rem;
            color: #38bdf8;
            font-weight: 500;
            word-break: keep-all;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .hobby-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background-color: #334155;
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .tag:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        /* 게임 카드 스타일 */
        .game-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-info h3 {
            font-size: 1.1rem;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .game-info p {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .btn-play {
            background-color: #10b981;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-play:hover {
            background-color: #059669;
        }

        .contact-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #334155;
        }

        .contact-info p {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .contact-info a {
            font-size: 1.05rem;
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-email {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .btn-email:hover {
            background-color: #7dd3fc;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }

        /* 게임 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            width: min(90vw, 660px);
            aspect-ratio: 640 / 520;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #38bdf8;
            position: relative;
        }

        .modal iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            margin-top: 15px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 메인 헤더 (이름, 학력, 한줄 소개) -->
        <header class="profile-header">
            <h1>함승호</h1>
            <p class="education">🎓 국민대학교 경영정보전공</p>
            <p class="tagline">데이터 분석을 통해 해결책을 제시하는 비즈니스 솔루션 제공자</p>
        </header>

        <!-- 프로젝트 / 웹 게임 섹션 -->
        <section class="section">
            <h2 class="section-title">Projects & Games</h2>
            <div class="game-card">
                <div class="game-info">
                    <h3>🐉 BUBBLE DRAGON</h3>
                    <p>직접 제작한 클래식 버블 드래곤 웹 게임</p>
                </div>
                <button class="btn-play" onclick="openGame()">게임 플레이 ▶</button>
            </div>
        </section>

        <!-- 취미 섹션 -->
        <section class="section">
            <h2 class="section-title">Interests & Hobbies</h2>
            <div class="hobby-tags">
                <span class="tag">⚽️ 축구</span>
                <span class="tag">🏋️‍♂️ 크로스핏</span>
                <span class="tag">🍽️ 맛집 탐방</span>
            </div>
        </section>

        <!-- 연락처 섹션 -->
        <section class="section">
            <h2 class="section-title">Contact</h2>
            <div class="contact-box">
                <div class="contact-info">
                    <p>Email</p>
                    <a href="mailto:hammy0408@gmail.com">hammy0408@gmail.com</a>
                </div>
                <a href="mailto:hammy0408@gmail.com" class="btn-email">메일 보내기</a>
            </div>
        </section>

        <footer>
            © 함승호. All rights reserved.
        </footer>
    </div>

    <!-- 게임 플레이 팝업 모달 -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <iframe id="gameFrame" src=""></iframe>
        </div>
        <button class="close-btn" onclick="closeGame()">창 닫기 ✖</button>
    </div>

    <script>
